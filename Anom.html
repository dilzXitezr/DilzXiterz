<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DILZ x AI - SCRIPT AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:#0a0a0f;color:#fff;height:100vh;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#15151f;border-bottom:1px solid #222}
.pp{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid #a855f7;box-shadow:0 0 12px #a855f7}
.pp img{width:100%;height:100%;object-fit:cover}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.b{max-width:85%;padding:10px 14px;border-radius:18px;font-size:13px;line-height:1.5}
.me{align-self:flex-end;background:linear-gradient(135deg,#a855f7,#ec4899)}
.ai{align-self:flex-start;background:#1a1a2a;border:1px solid #2a2a3a;display:flex;gap:8px}
.ai .s{width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid #a855f7}
.ai .s img{width:100%;height:100%;object-fit:cover}
.bar{display:flex;gap:8px;padding:10px;background:#15151f;border-top:1px solid #222}
.bar textarea{flex:1;min-height:44px;padding:12px 14px;border-radius:22px;border:1px solid #333;background:#0f0f1a;color:#fff;outline:none}
.send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;cursor:pointer}
.chips{display:flex;gap:6px;padding:8px 12px;overflow:auto;background:#0f0f1a}
.chip{padding:6px 12px;border-radius:99px;background:#1e1e2e;border:1px solid #2a2a3a;font-size:11px;white-space:nowrap;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="pp"><img src="PP_BASE64_HERE"></div><div><b>DILZ x AI</b><br><span style="font-size:10px;opacity:.6">SCRIPT AI • NO MALWARE • BY SEB</span></div></div>
<div class="chips">
<div class="chip" onclick="q('Halo min')">👋 Halo</div>
<div class="chip" onclick="q('Siapa kamu?')">🤖 Siapa kamu</div>
<div class="chip" onclick="q('/image eye in hand neon pink')">🎨 Gambar</div>
<div class="chip" onclick="q('Bikin web')">💻 Code</div>
</div>
<div class="msgs" id="m"><div class="b ai"><div class="s"><img src="PP_BASE64_HERE"></div><div><b>DILZ x AI READY!</b><br>Chat kayak Meta AI — PP nempel permanen!</div></div></div>
<div class="bar"><textarea id="i" placeholder="Tanya AI..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="send" onclick="send()">➤</button></div>
<script>
const PP="PP_BASE64_HERE";
const m=document.getElementById('m');const inp=document.getElementById('i');
function q(t){inp.value=t;send();}
function add(txt,who){let d=document.createElement('div');d.className='b '+(who==='me'?'me':'ai');if(who==='me')d.innerHTML=txt;else d.innerHTML=`<div class="s"><img src="${PP}"></div><div>${txt}</div>`;m.appendChild(d);m.scrollTop=m.scrollHeight;return d;}
async function send(){let txt=inp.value.trim();if(!txt)return;add(txt,'me');inp.value='';let th=add('⏳ DILZ x AI mikir...','ai');
setTimeout(async ()=>{try{
if(txt.toLowerCase().startsWith('/image')){
let p=txt.replace('/image','').trim()||'eye in hand';
let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random()*9999)}`;
th.querySelector('div:last-child').innerHTML=`🎨 <b>${p}</b><br><img src="${url}" style="width:100%;border-radius:10px;margin-top:8px">`;
}else{
let res=await fetch(`https://text.pollinations.ai/${encodeURIComponent('Kamu DILZ x AI v23, clone Meta AI, buatan SEB DILZNOELZ SMA AL-ATIQIYAH, jawab gaul min, no Gojo. User: '+txt)}`);
let t=await res.text();th.querySelector('div:last-child').innerHTML=t.replace(/\n/g,'<br>');
}
}catch(e){th.querySelector('div:last-child').innerHTML='Error: '+e.message;}
m.scrollTop=m.scrollHeight;},500);}
</script>
</body>
</html>
